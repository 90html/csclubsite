# Keeps data/msa-events.json (the saved copy of the MSA master calendar) fresh.
# The website uses it whenever a visitor's browser can't load the MSA calendar
# from Google directly.
name: Refresh MSA calendar

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-msa.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/msa-events.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/msa-events.json
            git commit -m "Refresh MSA calendar copy"
            git push
          fi
