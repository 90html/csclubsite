\n        </div>\n      </div>\n\n      <h3 class=\"rules-title\">Ways to earn</h3>\n      <ul class=\"rules\" role=\"list\">\n        <li class=\"card rule\" data-reveal=\"stagger\">\n          <span class=\"icon-tile\"><svg data-icon=\"users\" class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"/><path d=\"M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6.5 6.5 0 0 0-4-6\"/></svg></span>\n          <div><h4>Meetings</h4><p>Answer questions at meetings. The more you get right, the more points you earn.</p></div>\n          <span class=\"rule__pts mono\">Varies</span>\n        </li>\n        <li class=\"card rule\" data-reveal=\"stagger\">\n          <span class=\"icon-tile\"><svg data-icon=\"trophy\" class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M7 4h10v5a5 5 0 0 1-10 0V4Z\"/><path d=\"M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5M12 14v3M8.5 20.5h7M9.5 17.5h5v3h-5z\"/></svg></span>\n          <div><h4>Competitions</h4><p>Compete in contests like UIL invitationals to earn points.</p></div>\n          <span class=\"rule__pts mono\">Varies</span>\n        </li>\n        <li class=\"card rule\" data-reveal=\"stagger\">\n          <span class=\"icon-tile\"><svg data-icon=\"puzzle\" class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M10 3.5a2 2 0 0 1 4 0V5h4a1 1 0 0 1 1 1v4h-1.5a2 2 0 0 0 0 4H19v4a1 1 0 0 1-1 1h-4v-1.5a2 2 0 0 0-4 0V19H6a1 1 0 0 1-1-1v-4h1.5a2 2 0 0 0 0-4H5V6a1 1 0 0 1 1-1h4V3.5Z\"/></svg></span>\n          <div><h4>Problem of the Week</h4><p>
