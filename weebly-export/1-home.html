>String</span>[] args) {\n    <span class=\"t\">String</span>[] goals = {<span class=\"s\">\"learn\"</span>, <span class=\"s\">\"solve\"</span>, <span class=\"s\">\"compete\"</span>};\n    <span class=\"k\">for</span> (<span class=\"t\">String</span> g : goals)\n      System.out.println(<span class=\"s\">\"We \"</span> + g + <span class=\"s\">\".\"</span>);\n  }\n}\n\n<span class=\"p\">$</span> java Club.java\n<span class=\"o\">We learn.</span>\n<span class=\"o\">We solve.</span>\n<span class=\"o\">We compete.</span></pre>\n        </div>\n      </div>\n\n      <dl class=\"stats hero-in hero-in--4\">\n        <div class=\"stat\"><dt class=\"stat__label\">Our language</dt><dd class=\"stat__value\">Java</dd></div>\n        <div class=\"stat\"><dt class=\"stat__label\">We compete in</dt><dd class=\"stat__value\">UIL + local</dd></div>\n        <div class=\"stat\"><dt class=\"stat__label\">Student officers</dt><dd class=\"stat__value\" data-officer-count>9</dd></div>\n        <div class=\"stat\" data-stat-meeting><dt class=\"stat__label\">Faculty sponsors</dt><dd class=\"stat__value\">2</dd></div>\n      </dl>\n    </div>\n  </section>\n\n  <\!-- What we do -->\n  <section class=\"section\" aria-labelledby=\"what-title\">\n    <div class=\"container\">\n      <div class=\"section-head\">\n        <div class=\"section-head__text\" data-reveal>\n          <p class=\"eyebrow\">What we do</p>\n          <h2 id=\"what-title\">Code, compete, and have fun doing it.</h2>\n          <p>We bring computer science to everyone at Dulles, and turn problem solving into something you'll want to do.</p>\n        </div>\n      </div>\n      <div class=\"features\">\n        <article class=\"card card--pad card--hover feature\" data-reveal=\"stagger\">\n          <span class=\"icon-tile\"><svg data-icon=\"calendar\" class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusa
